<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>스피치 카드 보드</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="board-header">
        <div>
          <p class="eyebrow">THEME SPEECH</p>
          <h1>스피치 카드 보드</h1>
        </div>
        <div class="header-actions">
          <button class="limit-button" type="button" data-action="limits">
            <span aria-hidden="true">⚙</span>
            <span>카드 상한 설정</span>
          </button>
          <button class="reset-button" type="button" data-action="reset">
            <span aria-hidden="true">↺</span>
            <span>기록 초기화</span>
          </button>
        </div>
      </header>

      <section class="theme-board" id="themeBoard" aria-label="테마별 스피치 카드"></section>
    </main>

    <section class="spotlight" id="spotlight" aria-live="polite" aria-hidden="true"></section>

    <dialog class="limit-dialog" id="limitDialog" aria-labelledby="limitDialogTitle">
      <form class="limit-form" id="limitForm" method="dialog">
        <header class="limit-header">
          <h2 id="limitDialogTitle">카드 상한 설정</h2>
          <button class="dialog-close" type="button" data-action="close-limits" aria-label="닫기">×</button>
        </header>
        <div class="limit-fields" id="limitFields"></div>
        <footer class="limit-footer">
          <button class="secondary-button" type="button" data-action="close-limits">취소</button>
          <button class="primary-button" type="submit">저장</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
