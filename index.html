<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>스피치 카드 보드</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="board-header">
        <div>
          <p class="eyebrow">THEME SPEECH</p>
          <h1>스피치 카드 보드</h1>
        </div>
        <button class="reset-button" type="button" data-action="reset">
          <span aria-hidden="true">↺</span>
          <span>기록 초기화</span>
        </button>
      </header>

      <section class="theme-board" id="themeBoard" aria-label="테마별 스피치 카드"></section>
    </main>

    <section class="spotlight" id="spotlight" aria-live="polite" aria-hidden="true"></section>
  </body>
</html>
